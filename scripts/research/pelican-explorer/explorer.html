<div id="pelican-lab">
 <style>
 #pelican-lab .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
 #pelican-lab .drawing{width:100%;height:270px;object-fit:contain}
 #pelican-lab .empty{min-height:270px;display:grid;place-content:center;color:var(--destructive);background:var(--muted);padding:16px}
 #pelican-lab select{width:100%} #pelican-lab .tokenbox{overflow-wrap:anywhere;min-height:84px;padding:12px;background:var(--muted);border-radius:8px}
 #pelican-lab mark{background:var(--accent);color:var(--accent-foreground)}
 #pelican-lab .rmsrow{display:grid;grid-template-columns:65px 1fr 65px;align-items:center;gap:8px;margin:12px 0}
 #pelican-lab .rmsbar{height:12px;background:var(--viz-series-1)}
 #pelican-lab .right .rmsbar{background:var(--viz-series-2)}
 #pelican-lab .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
 #pelican-lab .stats{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
 #pelican-lab .recipe{overflow-wrap:anywhere} #pelican-lab [hidden]{display:none}
 @media(max-width:580px){#pelican-lab .pair{grid-template-columns:1fr}#pelican-lab .drawing{height:230px}}
 </style>
 <h2>Pelican lab</h2>
 <div class="toolbar" role="group" aria-label="Comparison shortcuts"><button class="btn" type="button" data-pair="0,2">Generation 1: ternary ↔ dense</button><button class="btn" type="button" data-pair="4,3">Generation 2: ternary ↔ dense</button><button class="btn" type="button" data-pair="1,4">Bonsai 2: original ↔ rerun</button></div>
 <div class="pair">
  <label class="form-label">Left specimen<select class="form-select" id="pel-left"></select></label>
  <label class="form-label">Right specimen<select class="form-select" id="pel-right"></select></label>
 </div>
 <div class="toolbar" role="group" aria-label="Explore comparison">
  <button class="btn btn-primary" type="button" data-mode="draw" aria-pressed="true">The drawings</button>
  <button class="btn" type="button" data-mode="tokens" aria-pressed="false">Token microscope</button>
  <button class="btn" type="button" data-mode="recipe" aria-pressed="false">Model recipes</button>
 </div>
 <label id="pel-repair-control" class="form-check"><input id="pel-repair" class="form-check-input" type="checkbox"> Show illustrative repair for invalid SVGs (first y2 → y1; not model output)</label>
 <div id="pel-draw" class="pair"></div>
 <div id="pel-tokens" hidden>
  <label class="form-label" for="pel-position">Relative decode position <output id="pel-progress">0%</output></label>
  <input class="form-range" id="pel-position" type="range" min="0" max="1000" value="0">
  <div class="toolbar"><button class="btn" id="pel-back" type="button">← Earlier</button><button class="btn" id="pel-next" type="button">Later →</button></div>
  <div class="pair" id="pel-micro"></div>
  <div class="text-small">Layer RMS · shared scale · different token sequences, unaligned activation coordinates</div>
 </div>
 <div id="pel-recipe" class="pair" hidden></div>
 <div class="text-small" id="pel-summary" aria-live="polite"></div>
 <section id="pel-retrospective" hidden></section>
 <script type="application/json" id="pel-data">__PELICAN_DATA__</script>
 <script>
 (()=>{
 const root=document.getElementById('pelican-lab'), $=id=>root.querySelector('#'+id), bundle=JSON.parse($('pel-data').textContent), data=bundle.models;
 const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 for(const id of ['pel-left','pel-right']) $(''+id).innerHTML=data.map((d,i)=>`<option value="${i}">${safe(d.name)}</option>`).join('');
 $('pel-left').value=data.length-1;$('pel-right').value=3;
 let mode='draw';
 function draw(){
 const pair=[$('pel-left').value,$('pel-right').value].map(i=>data[+i]);
 $('pel-draw').innerHTML=pair.map(d=>`<section><h3>${safe(d.name)}</h3>${(d.svg||($('pel-repair').checked&&d.repair))?`${!d.svg?'<div class="text-destructive">Illustrative repair · not original model output</div>':''}<img class="drawing" alt="${d.svg?'Original':'Illustratively repaired'} ${safe(d.name)} pelican drawing" src="${d.svg||d.repair}">`:`<div class="empty">SVG did not parse<br>${safe(d.error)}</div>`}<div class="stats tabular-nums"><span>${d.tokens.length.toLocaleString()} decode steps</span><span>${d.count.toLocaleString()} vectors</span><span>${d.seconds.toFixed(1)} s with capture</span></div><details><summary>Drawing ingredients</summary><div>${Object.entries(d.shapes).map(([k,v])=>`${safe(k)} × ${v}`).join(' · ')||'Unavailable: invalid XML'}</div></details><details><summary>Original source</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${safe(d.output)}</pre></details></section>`).join('');
 $('pel-recipe').innerHTML=pair.map(d=>`<section class="recipe"><h3>${safe(d.name)}</h3><dl><dt>Checkpoint</dt><dd>${safe(d.repo)}</dd><dt>Stored weights</dt><dd>${safe(d.precision)}</dd><dt>Revision</dt><dd><code>${safe(d.revision)}</code></dd><dt>Sampling</dt><dd>Temperature 0.3 · top-p 0.95 · top-k 20 · seed 42</dd><dt>Measured layer outputs</dt><dd>0, 31, 63 · 5,120 dimensions each</dd><dt>Captured during</dt><dd>Original inference</dd></dl></section>`).join('');
 $('pel-repair-control').hidden=mode!=='draw';
 const q=+$('pel-position').value/1000;$('pel-progress').textContent=(q*100).toFixed(1)+'%';
 const selections=pair.map(d=>{const i=Math.round(q*(d.tokens.length-1));return {d,i,r:d.rms[i]}});
 const scale=Math.max(...pair.map(d=>d.maxRms));
 $('pel-micro').innerHTML=selections.map(({d,i,r},side)=>`<section class="${side?'right':'left'}"><h3>${safe(d.name)}</h3><div class="text-small">Decode step ${i+1} / ${d.tokens.length}</div><div class="tokenbox"><code>${safe(d.tokens.slice(Math.max(0,i-7),i).join(''))}<mark>${safe(d.tokens[i])||'∅'}</mark>${safe(d.tokens.slice(i+1,i+8).join(''))}</code></div>${r.map((v,j)=>`<div class="rmsrow"><span>Layer ${[0,31,63][j]}</span><div><div class="rmsbar" style="width:${100*v/scale}%"></div></div><span class="tabular-nums">${v.toFixed(3)}</span></div>`).join('')}</section>`).join('');
 $('pel-summary').textContent=mode==='draw'?($('pel-repair').checked?'Repair preview is illustrative; original source and measured activations remain unchanged.':'Original outputs · one sample per original model; Bonsai 2 rerun retained separately'):mode==='tokens'?'Recorded sequence position, not elapsed time or a causal explanation. RMS summarizes vector magnitude.':'Same prompt and numeric sampling settings; different precisions, runtimes, and random-number implementations.';
 }
 root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;root.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('btn-primary',x===b);x.setAttribute('aria-pressed',x===b)});for(const m of ['draw','tokens','recipe'])$('pel-'+m).hidden=m!==mode;draw()});
 $('pel-repair').onchange=draw;$('pel-left').onchange=draw;$('pel-right').onchange=draw;$('pel-position').oninput=draw;
 root.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>{const [a,z]=b.dataset.pair.split(',');$('pel-left').value=a;$('pel-right').value=z;draw()});
 $('pel-next').onclick=()=>{$('pel-position').value=Math.min(1000,+$('pel-position').value+10);draw()};$('pel-back').onclick=()=>{$('pel-position').value=Math.max(0,+$('pel-position').value-10);draw()};draw();
 if(bundle.repair){
 const r=bundle.repair, link=id=>`http://127.0.0.1:5210/#/experiments/5/runs/${encodeURIComponent(id)}`;
 $('pel-retrospective').hidden=false;
 $('pel-retrospective').innerHTML=`<hr><h2>Retrospective: one coordinate, a broken drawing, a measured fix</h2>
 <div class="pair"><div><h3>What went wrong</h3><p>Bonsai 2 used <code>y2</code> twice on the bicycle fork. XML rejected the entire drawing at line 97, column 39. The same-seed rerun reproduced the exact output.</p><p>We retrieved that output from MLflow, gave Bonsai 2 the validator error and original SVG, and asked for only the corrected line. Sampling stayed unchanged; the task became a targeted correction with a 512-token output ceiling.</p><h3>The model’s correction</h3><div class="tokenbox"><div>Before: <code>${safe(r.before_element)}</code></div><div>After: <code>${safe(r.model_patch)}</code></div></div></div>
 <div><h3>Validated repaired output</h3><img class="drawing" alt="Validated SVG after the recorded Bonsai2 correction" src="${r.image}"><div class="text-small">Separate model-assisted repair; original benchmark result remains failed.</div></div></div>
 <h3>What proves the fix</h3><ul><li>The correction model emitted the replacement; a strict gate preserved coordinates and allowed only the expected line patch.</li><li>The full SVG passed XML and isolated-preview safety validation: 103 elements. Five regression tests reject changed geometry, extra content, ambiguous targets, and unsafe full documents.</li><li>The correction recorded ${r.tokens} tokens, ${r.vectors} real layer vectors, and ${r.seconds.toFixed(2)} instrumented seconds. Original and repaired artifact hashes are retained.</li></ul>
 <p><a href="${link(r.source_mlflow_run)}" target="_blank" rel="noopener">Failed rerun in MLflow</a> · <a href="${link(r.correction_inference.run_id)}" target="_blank" rel="noopener">Correction inference + activations</a> · <a href="${link(r.pipeline_run_id)}" target="_blank" rel="noopener">Repair validation + artifacts</a></p>
 <h3>What we learned</h3><p>Retrying the same input reproduced the same defect. Validator feedback plus a bounded patch fixed this output. This is a tested output-repair step—not a weight update, a fresh unassisted benchmark pass, or evidence that one activation caused the typo. Drawing quality still needs human review.</p>`;
 }
 })();
 </script>
</div>
